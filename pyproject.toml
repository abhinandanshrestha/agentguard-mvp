[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "Evaluating and Governing AI Agents in Data Engineering Workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.11"
authors = [{ name = "AgentGuard Contributors" }]
keywords = [
    "ai-agents",
    "data-engineering",
    "evaluation",
    "governance",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100.0,<1.0.0",
    "uvicorn>=0.23.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "pydantic-settings>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "pandas>=2.0.0,<2.3.0",
    "faker>=18.0.0,<35.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    "psycopg[binary]>=3.1.0,<4.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.31.0,<3.0.0",
]

[project.scripts]
agentguard = "agentguard.cli:main"

[project.urls]
Documentation = "https://github.com/agentguard/agentguard#readme"
Issues = "https://github.com/agentguard/agentguard/issues"
Source = "https://github.com/agentguard/agentguard"

[dependency-groups]
dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.21.0,<1.0.0",
    "httpx>=0.24.0,<1.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.5.0,<2.0.0",
    "types-pyyaml>=6.0.0,<7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.ruff]
target-version = "py310"
line-length = 99
src = ["src", "tests"]
exclude = [
    ".git",
    ".mypy_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "results",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint subset
    "RUF",    # ruff-specific
    "S",      # flake8-bandit (security)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (needed for FastAPI Depends)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "S101",   # assert usage (fine in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ARG001", "PLR2004"]
# PLR0912: Complex main()/command functions are acceptable for CLI scripts
"src/agentguard/cli.py" = ["PLR0912"]
# PLR0912: Complex main() is acceptable for CLI scripts
"scripts/**/*.py" = ["S603", "S607", "S311", "PLR0915", "PLC0415", "PLR0912"]
"src/agentguard/agent/tools.py" = ["S603", "S607"]
# S311: random is fine for synthetic data (not cryptographic)
# PLC0415: import inside function is intentional to defer import
# PLW0108: lambda for default_factory is required for mutable defaults
"src/agentguard/benchmark/weather_fetcher.py" = ["S311", "PLC0415", "PLW0108"]
# ARG001: cls is required by pydantic field_validator signature
"src/agentguard/config.py" = ["ARG001"]

[tool.ruff.lint.isort]
known-first-party = ["agentguard"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["integration: marks tests as integration tests (may be slow)"]
norecursedirs = ["benchmark", "results", ".venv", "__pycache__"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
files = ["src"]
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = ["pandas.*", "faker.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
